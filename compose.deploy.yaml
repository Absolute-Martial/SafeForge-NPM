services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SAFEFORGE_NPM_PUBLIC_PORT:-8000}:8000"
    environment:
      SAFEFORGE_NPM_API_HOST: 0.0.0.0
      SAFEFORGE_NPM_API_PORT: 8000
      SAFEFORGE_NPM_RUNTIME_ROOT: /runtime
      SAFEFORGE_NPM_RUNTIME_HOST_ROOT: ${SAFEFORGE_NPM_RUNTIME_HOST_ROOT:-/var/lib/safeforge-npm/runtime}
      SAFEFORGE_NPM_SANDBOX_NETWORK: ${SAFEFORGE_NPM_SANDBOX_NETWORK:-none}
      SAFEFORGE_NPM_PUBLISH_ENABLED: ${SAFEFORGE_NPM_PUBLISH_ENABLED:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SAFEFORGE_NPM_RUNTIME_HOST_ROOT:-/var/lib/safeforge-npm/runtime}:/runtime
